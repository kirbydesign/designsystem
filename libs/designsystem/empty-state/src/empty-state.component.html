<div class="message-container">
  @if (iconName) {
    <div class="icon-outline">
      <kirby-icon [name]="iconName" size="lg"></kirby-icon>
    </div>
  }
  @if (title) {
    <span class="title kirby-text-medium">{{ title }}</span>
  }
  @if (subtitle) {
    <p class="subtitle">{{ subtitle }}</p>
  }
  <div class="content">
    <ng-content></ng-content>
  </div>
</div>
