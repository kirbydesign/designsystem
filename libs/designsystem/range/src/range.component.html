<ion-range
  (ionChange)="_onRangeValueChange($event)"
  [min]="min"
  [max]="max"
  [step]="step"
  [value]="value"
  [pin]="pin"
  [pinFormatter]="pinFormatter"
  [snaps]="ticks"
  [ticks]="ticks"
  [debounce]="debounce"
  [disabled]="disabled"
></ion-range>

@if (minLabel) {
  <label class="min-label">{{ minLabel }}</label>
}
@if (maxLabel) {
  <label class="max-label">{{ maxLabel }}</label>
}
