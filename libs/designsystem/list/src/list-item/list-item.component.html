<ion-item-sliding
  [class.selected]="isSelected"
  [kirbyListItemColor]="getItemColor"
  [item]="item"
  [disabled]="_isSwipingEnabled ? null : true"
  keyHandler
  [ngClass]="boundaryClass"
  (click)="_onItemSelect(item)"
>
  <ng-container
    *ngTemplateOutlet="swipeActionsTemplate; context: { $implicit: item }"
  ></ng-container>
  <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item }"></ng-container>
</ion-item-sliding>

<ng-template #swipeActionsTemplate let-item>
  @if (_hasSwipeActions(item)) {
    <ion-item-options [side]="_getSwipeActionEnd(item)">
      <div class="swipe-action">
        @for (swipeAction of _getSwipeActions(item); track swipeAction.title) {
          <ion-item-option
            [ngClass]="_getSwipeActionType(swipeAction, item)"
            (click)="_onSwipeActionSelect(swipeAction, item, $event)"
          >
            <div class="item-content">
              @if (_getSwipeActionIcon(swipeAction, item)) {
                <kirby-icon size="sm" [name]="_getSwipeActionIcon(swipeAction, item)"></kirby-icon>
              }
              <ion-label>
                {{ _getSwipeActionTitle(swipeAction, item) }}
              </ion-label>
            </div>
          </ion-item-option>
        }
      </div>
    </ion-item-options>
  }
</ng-template>
