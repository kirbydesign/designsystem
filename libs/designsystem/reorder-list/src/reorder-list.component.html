@if (reorderActive) {
  <ion-backdrop [tappable]="false" [visible]="true" [stopPropagation]="false"></ion-backdrop>
}
<ion-reorder-group (ionItemReorder)="doReorder($event)" disabled="false">
  @for (reorderItem of items; track reorderItem) {
    <div>
      <kirby-card>
        <ng-container
          *ngTemplateOutlet="
            itemTemplate || defaultItemTemplate;
            context: { $implicit: reorderItem }
          "
        ></ng-container>
        @if (reorderItem[subItemsName]) {
          <div #reorderGroupContainer>
            <ion-reorder-group
              (ionItemReorder)="doSubReorder($event, reorderItem)"
              disabled="false"
            >
              @for (subItem of reorderItem[subItemsName]; track subItem) {
                <div>
                  <ng-container
                    *ngTemplateOutlet="
                      itemTemplate || defaultItemTemplate;
                      context: { $implicit: subItem, isSubItem: true }
                    "
                  ></ng-container>
                </div>
              }
            </ion-reorder-group>
          </div>
        }
      </kirby-card>
    </div>
  }
</ion-reorder-group>

<ng-template #defaultItemTemplate let-item let-isSubItem>
  <kirby-item [reorderable]="true">
    <p class="kirby-item-title">{{ getItemTextDefault(item) }}</p>
  </kirby-item>
</ng-template>
