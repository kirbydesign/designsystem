<div class="slide-button-container" [ngClass]="{ 'slide-done': isSlideDone }" [inert]="isSlideDone">
  <input
    tabindex="-1"
    type="range"
    (mouseup)="onSliderMouseup()"
    (touchend)="onSliderMouseup()"
    (input)="onSliderValueChange($event.target.value)"
    (mousedown)="onSliderMousedown()"
    (touchstart)="onSliderMousedown()"
    class="slide-button"
    [value]="value"
    max="100"
    aria-hidden="true"
  />
  <p class="slide-button-text slide-{{ pctInTens }}-pct" aria-hidden="true">{{ text }}</p>
  <button #hiddenButton class="kirby-visually-hidden breakout" (click)="handleSlideDone()">
    {{ text }}
  </button>
</div>
