<svg width="100%" height="100%" aria-hidden="true">
  <circle
    shape-rendering="geometricPrecision"
    class="circle"
    fill="transparent"
    cx="50%"
    cy="50%"
  />
  @if (_progress > 0) {
    <circle
      shape-rendering="geometricPrecision"
      class="progress"
      fill="transparent"
      [attr.stroke-linecap]="_linecap"
      pathLength="100"
      cx="50%"
      cy="50%"
      [attr.stroke-dasharray]="_progress + ' ' + _remainder"
    />
  }
</svg>
