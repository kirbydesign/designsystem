<svg width="100%" height="100%" aria-hidden="true">
  <circle
    shape-rendering="geometricPrecision"
    class="circle"
    fill="transparent"
    cx="50%"
    cy="50%"
  />
  <circle
    shape-rendering="geometricPrecision"
    class="progress"
    fill="transparent"
    pathLength="100"
    cx="50%"
    cy="50%"
    [attr.stroke-linecap]="_linecap"
    [attr.stroke-dasharray]="_progress + ' ' + _remainder"
  />
</svg>
