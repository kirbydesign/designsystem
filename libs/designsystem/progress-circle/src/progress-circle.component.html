<div
  class="transcluded-content"
  role="progressbar"
  [attr.aria-valuenow]="_shownValue"
  [attr.aria-label]="_ariaLabel"
>
  <ng-content></ng-content>
</div>
<kirby-progress-circle-ring
  [themeColor]="themeColor"
  [value]="_shownValue"
  [radius]="_radius"
  [strokeWidth]="_strokeWidth"
  [upperBound]="_upperBound"
></kirby-progress-circle-ring>
