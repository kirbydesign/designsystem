<ion-radio
  [value]="value"
  [disabled]="disabled"
  mode="md"
  [labelPlacement]="_labelPlacement"
  [justify]="_justify"
>
  @if (_labelText) {
    <span class="hidden-label">{{ _labelText }}</span>
  }
  @if (text) {
    <span [attr.aria-hidden]="_labelText ? true : undefined">{{ text }}</span>
  }
  <span class="default-content" [attr.aria-hidden]="_labelText ? true : undefined">
    <ng-content></ng-content>
  </span>
</ion-radio>
