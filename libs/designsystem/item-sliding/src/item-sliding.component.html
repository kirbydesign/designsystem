<ion-item-sliding>
  <ng-content></ng-content>

  @if (_hasSwipeActions) {
    <ion-item-options [side]="_side">
      @for (swipeAction of swipeActions; track swipeAction) {
        @if (!swipeAction.isDisabled) {
          <ion-item-option [ngClass]="swipeAction.type" (click)="onSwipeActionClick(swipeAction)">
            @if (swipeAction.icon !== undefined) {
              <kirby-icon [name]="swipeAction.icon" slot="top"></kirby-icon>
            }
            <ion-label>{{ swipeAction.title }}</ion-label>
          </ion-item-option>
        }
      }
    </ion-item-options>
  }
</ion-item-sliding>
