<div class="avatar" [ngClass]="{ overlay: overlay, stroke: stroke }">
  @if (imageSrc) {
    <img
      [src]="imageSrc"
      [attr.alt]="altText"
      [attr.loading]="imageLoading"
      (error)="onImageError($event)"
    />
  }
  @if (!text) {
    <ng-content select="kirby-icon"></ng-content>
  }
  @if (text) {
    <span class="avatar-text">{{ text }}</span>
  }
</div>
<ng-content select="kirby-badge"></ng-content>
