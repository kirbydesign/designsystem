<div class="header">
  <div class="month-navigator">
    <button
      type="button"
      [disabled]="!_canNavigateBack"
      (click)="_changeMonth(-1)"
      kirby-button
      [noDecoration]="true"
      class="no-margin"
    >
      <kirby-icon name="arrow-back"></kirby-icon>
    </button>

    <div class="month-and-year" id="month-and-year">
      <span class="month">{{ activeMonthName }}</span>
      <span *ngIf="!_hasYearNavigator" class="year">{{ activeYear }}</span>
    </div>

    <button
      type="button"
      [disabled]="!_canNavigateForward"
      (click)="_changeMonth(1)"
      kirby-button
      [noDecoration]="true"
      class="no-margin"
    >
      <kirby-icon name="arrow-more"></kirby-icon>
    </button>
  </div>
  <kirby-dropdown
    *ngIf="_hasYearNavigator"
    [usePopover]="usePopover"
    [selectedIndex]="navigatedYear"
    [items]="navigableYears"
    popout="left"
    (change)="_changeYear($event)"
  ></kirby-dropdown>
</div>

<table aria-labelledby="month-and-year">
  <thead>
    <tr>
      <th *ngFor="let weekDay of _weekDays">{{ weekDay }}</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let week of _month">
      <td *ngFor="let day of week">
        <button
          kirby-button
          (click)="_onDateSelected(day)"
          [tabIndex]="day.isFocussed ? 0 : -1"
          class="{{ day.cssClasses }}"
          [class.selected]="day.isSelected"
          [class.focussed]="day.isFocussed"
          [noDecoration]="true"
        >
          {{ day.date }}
        </button>
      </td>
    </tr>
  </tbody>
</table>
