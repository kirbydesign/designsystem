<kirby-card>
  @if (header) {
    <kirby-card-header
      [title]="header"
      [isTitleBold]="true"
      [subtitle]="subheader"
    ></kirby-card-header>
  }
  @for (item of items; track item.id) {
    <button
      kirby-button
      expand="block"
      size="lg"
      [noDecoration]="true"
      (click)="onItemSelect(item)"
    >
      {{ item.text }}
    </button>
  }
</kirby-card>
@if (!hideCancel) {
  <button kirby-button class="cancel-btn" size="lg" attentionLevel="3" (click)="onCancel()">
    {{ cancelButtonText }}
  </button>
}
