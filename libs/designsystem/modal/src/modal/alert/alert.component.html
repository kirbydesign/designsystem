<article #alertWrapper>
  <kirby-empty-state
    [iconName]="iconName"
    [themeColor]="iconThemeColor"
    [title]="title$ | async"
    [subtitle]="message$ | async"
  ></kirby-empty-state>
  <div class="buttongroup">
    @if (cancelBtn$ | async; as cancelBtn) {
      <button kirby-button attentionLevel="3" class="cancel-btn" (click)="onCancel()">
        {{ cancelBtn }}
      </button>
    }
    <button
      kirby-button
      [size]="(cancelBtn$ | async) ? null : 'lg'"
      attentionLevel="1"
      class="ok-btn"
      [class.destructive]="okBtnIsDestructive"
      (click)="onOk()"
    >
      {{ okBtn$ | async }}
    </button>
  </div>
</article>
