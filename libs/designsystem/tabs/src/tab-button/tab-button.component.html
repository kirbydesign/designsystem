<ion-tab-button
  #ionTabButton
  [tab]="tab"
  (click)="onClick($event, ionTabButton.selected)"
  tabindex="0"
>
  @if (icons.length === 1 || !ionTabButton.selected) {
    <ng-content select="kirby-icon:not([selected-tab])"></ng-content>
  }
  @if (ionTabButton.selected) {
    <ng-content select="kirby-icon[selected-tab]"></ng-content>
  }
  <ng-content></ng-content>
  <ng-content select="kirby-badge"></ng-content>
</ion-tab-button>
