<ion-item
  lines="none"
  [disabled]="disabled"
  [button]="_renderButton"
  [href]="_renderLink"
  [detail]="false"
  (mousedown)="onMouseDown($event)"
>
  <div class="outside" slot="start">
    <ng-content select="[slot='outside']"></ng-content>
  </div>
  <ng-content></ng-content>
  @if (reorderable) {
    <ion-reorder slot="end">
      <kirby-icon name="reorder"></kirby-icon>
    </ion-reorder>
  }

  @if (disclosure) {
    <span class="disclosure" slot="end">
      <kirby-icon
        [class.rotate]="rotateIcon && (disclosure === 'arrow-down' || disclosure === 'arrow-up')"
        name="{{ disclosure }}"
      ></kirby-icon>
    </span>
  }
</ion-item>
