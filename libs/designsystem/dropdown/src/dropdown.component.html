<button
  kirby-button
  type="button"
  role="combobox"
  aria-haspopup="listbox"
  [attr.aria-expanded]="isOpen"
  [attr.aria-labelledby]="'dropdown-button-label'"
  [attr.aria-controls]="'dropdown-list'"
  id="dropdown-button"
  [size]="size"
  [attentionLevel]="attentionLevel"
  (click)="onToggle($event)"
  (mousedown)="onButtonMouseEvent($event)"
  [disabled]="disabled"
  (keydown)="onKeyDown($event)"
>
  <span class="text">{{ selectedText || placeholder }}</span>
  <kirby-icon [name]="isOpen ? 'arrow-up' : 'arrow-down'"></kirby-icon>
</button>

<kirby-card
  role="listbox"
  id="dropdown-list"
  aria-labelledby="dropdown-button-label"
  *ngIf="isOpen"
  (keydown)="onKeyDown($event)"
>
  <kirby-item
    *ngFor="let item of items; let i = index"
    role="option"
    [id]="'option-' + i"
    [attr.aria-selected]="i === selectedIndex"
    tabindex="-1"
  >
    {{ getTextFromItem(item) }}
  </kirby-item>
</kirby-card>
