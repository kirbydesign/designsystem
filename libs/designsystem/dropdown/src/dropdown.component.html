<button
  kirby-button
  type="button"
  [attr.id]="_comboboxId"
  role="combobox"
  aria-haspopup="listbox"
  [attr.aria-controls]="_listboxId"
  [attr.aria-expanded]="isOpen"
  [attr.aria-activedescendant]="_listboxId + '-item-' + focusedIndex"
  [attr.aria-invalid]="hasError"
  [size]="size"
  [attentionLevel]="attentionLevel"
  (click)="onToggle($event)"
  [disabled]="disabled"
  [tabindex]="_tabindex"
>
  <span class="text">{{ selectedText || placeholder }}</span>
  <kirby-icon [name]="isOpen ? 'arrow-up' : 'arrow-down'"></kirby-icon>
</button>

<kirby-popover
  [target]="buttonElement"
  [popout]="popout"
  (click)="_onPopoverClick()"
  (willHide)="_onPopoverWillHide()"
>
  <kirby-card role="listbox" [attr.id]="_listboxId" [attr.aria-labelledby]="_comboboxId">
    @for (item of items; track item; let i = $index) {
      <ng-container
        *ngTemplateOutlet="
          itemTemplate || defaultItemTemplate;
          context: {
            $implicit: item,
            selected: i === selectedIndex,
            focused: i === focusedIndex,
            index: i,
          }
        "
      ></ng-container>
    }
  </kirby-card>
</kirby-popover>

<ng-template
  #defaultItemTemplate
  let-item
  let-selected="selected"
  let-index="index"
  let-focused="focused"
>
  <kirby-item
    [selectable]="true"
    [selected]="selected"
    (click)="onItemSelect(index)"
    [class.focused]="focused"
    role="option"
    [attr.id]="_listboxId + '-item-' + index"
    [attr.aria-selected]="selected"
  >
    <p class="kirby-item-title">{{ getTextFromItem(item) }}</p>
    @if (selected) {
      <kirby-icon name="checkmark-selected" slot="end"></kirby-icon>
    }
  </kirby-item>
</ng-template>
