<span class="kirby-visually-hidden" aria-live="polite" aria-atomic="true">
  {{ _liveRegionText }}
</span>
<div (click)="onToggle($event)" #rootElement>
  <input
    kirby-input
    type="text"
    aria-haspopup="listbox"
    role="combobox"
    [hasError]="hasError"
    [size]="size"
    [disabled]="disabled"
    [placeholder]="placeholder"
    (change)="$event.stopPropagation()"
    [attr.id]="_comboboxId"
    [attr.aria-controls]="_listboxId"
    [attr.aria-expanded]="isOpen"
    [attr.aria-activedescendant]="isOpen && focusedItem ? getItemId(focusedItem) : null"
    (input)="onInput($event)"
  />
  <kirby-icon [name]="isOpen ? 'arrow-up' : 'arrow-down'" kirby-affix="suffix"></kirby-icon>
</div>

<kirby-popover
  [target]="rootElement"
  [popout]="popout"
  (click)="onPopoverClick()"
  (willHide)="onPopoverWillHide()"
>
  <kirby-card [attr.id]="_listboxId" [attr.aria-labelledby]="_comboboxId">
    @if (navigableItems.length === 0) {
      <kirby-item>
        <p class="kirby-item-title no-results">{{ noSearchResultsText }}</p>
      </kirby-item>
    } @else {
      <cdk-virtual-scroll-viewport
        class="combobox-viewport"
        role="listbox"
        minBufferPx="1240"
        maxBufferPx="1620"
        [style.height.px]="viewportHeight"
      >
        <ng-container *cdkVirtualFor="let item of searchItems">
          @if (isGroupItem(item)) {
            <ng-container
              *ngTemplateOutlet="
                groupHeaderTemplate || defaultGroupHeaderTemplate;
                context: { $implicit: item }
              "
            ></ng-container>
          } @else {
            <ng-container
              *ngTemplateOutlet="
                itemTemplate || defaultItemTemplate;
                context: {
                  $implicit: item,
                  selected: item === selectedItem,
                  focused: item === focusedItem,
                }
              "
            ></ng-container>
          }
        </ng-container>
      </cdk-virtual-scroll-viewport>
    }
  </kirby-card>
</kirby-popover>

<ng-template #defaultItemTemplate let-item let-selected="selected" let-focused="focused">
  <kirby-item
    role="option"
    [selectable]="true"
    [selected]="selected"
    [class.keyboard-focused]="focused"
    [attr.id]="getItemId(item)"
    [attr.aria-selected]="selected"
    (click)="onItemSelect(item)"
  >
    <p class="kirby-item-title">{{ getItemText(item) }}</p>
    @if (selected) {
      <kirby-icon name="checkmark-selected" slot="end"></kirby-icon>
    }
  </kirby-item>
</ng-template>

<ng-template #defaultGroupHeaderTemplate let-group>
  <kirby-item
    [attr.id]="group.id">
    <p class="kirby-item-detail">{{ group.displayName }}</p>
  </kirby-item>
</ng-template>
