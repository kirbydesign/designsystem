<div (click)="onToggle($event)" #rootElement>
  <input
    kirby-input
    type="text"
    [attr.id]="_comboboxId"
    aria-haspopup="listbox"
    [attr.aria-controls]="_listboxId"
    [attr.aria-expanded]="isOpen"
    [attr.aria-activedescendant]="isOpen && focusedItem ? getItemId(focusedItem) : null"
    [hasError]="hasError"
    [size]="size"
    [disabled]="disabled"
    [placeholder]="placeholder"
    (input)="updateSearchResults($event)"
  />
  <kirby-icon [name]="isOpen ? 'arrow-up' : 'arrow-down'" kirby-affix="suffix"></kirby-icon>
</div>

<kirby-popover
  [target]="rootElement"
  [popout]="popout"
  (click)="onPopoverClick()"
  (willHide)="onPopoverWillHide()"
>
  <kirby-card role="listbox" [attr.id]="_listboxId" [attr.aria-labelledby]="_comboboxId">
    @if (searchItems.length === 0) {
      <kirby-item>
        <p class="kirby-item-title no-results">{{ noSearchResultsText }}</p>
      </kirby-item>
    } @else {
      <cdk-virtual-scroll-viewport
        class="combobox-viewport"
        minBufferPx="1240"
        maxBufferPx="1620"
        [itemSize]="itemHeight"
        [style.height.px]="viewportHeight"
      >
        <ng-container *cdkVirtualFor="let item of searchItems; let i = index">
          <ng-container
            *ngTemplateOutlet="
              itemTemplate || defaultItemTemplate;
              context: {
                $implicit: item,
                selected: item === selectedItem,
                focused: item === focusedItem,
                index: i,
                setsize: searchItems.length,
              }
            "
          ></ng-container>
        </ng-container>
      </cdk-virtual-scroll-viewport>
    }
  </kirby-card>
</kirby-popover>

<ng-template
  #defaultItemTemplate
  let-item
  let-selected="selected"
  let-focused="focused"
  let-index="index"
  let-setsize="setsize"
>
  <kirby-item
    role="option"
    [selectable]="true"
    [selected]="selected"
    [class.focused]="focused"
    [attr.id]="getItemId(item)"
    [attr.aria-selected]="selected"
    [attr.aria-setsize]="setsize"
    [attr.aria-posinset]="index + 1"
    (click)="onItemSelect(item)"
  >
    <p class="kirby-item-title">{{ getItemText(item) }}</p>
    @if (selected) {
      <kirby-icon name="checkmark-selected" slot="end"></kirby-icon>
    }
  </kirby-item>
</ng-template>
