@if (externalLink) {
  <kirby-card [themeColor]="backgroundBlur === 'none' ? 'white' : backgroundBlur">
    <ng-container *ngTemplateOutlet="sharedCardContent"></ng-container>
  </kirby-card>
}

@if (!externalLink) {
  <kirby-card [themeColor]="backgroundBlur === 'none' ? 'white' : backgroundBlur">
    <ng-container *ngTemplateOutlet="sharedCardContent"></ng-container>
  </kirby-card>
}

<ng-template #sharedCardContent>
  <div class="blur-image-wrapper">
    <img class="blur-image" [src]="imagePath" alt="" />
  </div>

  <div class="main-content-wrapper">
    <div class="main-content-image-wrapper">
      <img class="main-content-image" [src]="imagePath" alt="" (error)="onImageError($event)" />
    </div>

    <div class="main-content">
      <div class="text-content-layout">
        <div class="main-content-header">
          <p class="kirby-text-normal-bold">
            @if (title) {
              {{ title }}
            } @else {
              <ng-content select="[title]"></ng-content>
            }
          </p>
        </div>

        <div class="main-content-body">
          <p class="main-content-body-text kirby-text-small">
            @if (bodyText) {
              {{ bodyText }}
            } @else {
              <ng-content select="[bodyText]"></ng-content>
            }
          </p>
        </div>
      </div>
      <!-- On large screens we also show a button-like anchor tag in addition to the entire banner anchor -->
      @if (externalLink) {
        <a
          kirby-button
          class="main-content-body-action"
          [class.reset]="!showButtonInNarrowView"
          [attentionLevel]="backgroundBlur === 'none' ? '3' : '2'"
          [href]="externalLink"
          target="_blank"
          size="sm"
        >
          <span class="main-content-body-action-text">{{ actionButtonText }}</span>
          <kirby-icon name="link"></kirby-icon>
        </a>
      }

      @if (!externalLink) {
        <button
          [class.reset]="!showButtonInNarrowView"
          class="main-content-body-action"
          kirby-button
          [attentionLevel]="backgroundBlur === 'none' ? '3' : '2'"
          size="sm"
        >
          <span class="main-content-body-action-text">{{ actionButtonText }}</span>
        </button>
      }
    </div>
  </div>

  @if (dismissClick.observed) {
    <div class="dismiss">
      <button
        kirby-button
        (click)="dismissClicked($event)"
        [attentionLevel]="backgroundBlur === 'none' ? '3' : '2'"
        [showIconOnly]="true"
        size="xs"
        [attr.aria-label]="translations.get('close') + ' ' + title"
      >
        <kirby-icon name="close"></kirby-icon>
      </button>
    </div>
  }
</ng-template>
