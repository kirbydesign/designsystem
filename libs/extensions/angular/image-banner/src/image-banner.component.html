<kirby-card>
  <div class="blur-image-wrapper">
    <img class="blur-image" [src]="imagePath" alt="" />
  </div>

  <div class="main-content-wrapper">
    <div class="main-content-image-wrapper">
      <img class="main-content-image" [src]="imagePath" alt="" (error)="onImageError($event)" />
    </div>

    <div class="main-content">
      <div class="text-content-layout">
        <div class="main-content-header">
          @if (title) {
            <p class="kirby-text-normal-bold">
              {{ title }}
            </p>
          } @else {
            <div class="title kirby-text-normal-bold">
              <ng-content select="[title]"></ng-content>
            </div>
          }
        </div>

        <div class="main-content-body">
          <p class="main-content-body-text kirby-text-small">
            @if (bodyText) {
              {{ bodyText }}
            } @else {
              <ng-content select="[bodyText]"></ng-content>
            }
          </p>
        </div>
      </div>
      @if (externalLink) {
        <!-- Only one of below anchors is displayed at a time -
            we want different behavior on varying screen widths -->
        <a
          kirby-button
          class="kirby-breakout wide-view-action kirby-surface-raised"
          [attentionLevel]="'2'"
          [href]="externalLink"
          target="_blank"
          size="sm"
        >
          {{ actionButtonText }}
          <kirby-icon name="link"></kirby-icon>
        </a>

        <a
          kirby-button
          class="kirby-breakout narrow-view-action"
          [href]="externalLink"
          [noDecoration]="true"
          [attentionLevel]="'2'"
          [showIconOnly]="true"
          target="_blank"
          size="sm"
        >
          {{ actionButtonText }}
          <kirby-icon name="link"></kirby-icon>
        </a>
      }

      @if (!externalLink) {
        <!-- Only one of below buttons is displayed at a time -
            we want different behavior on varying screen widths -->
        <button
          kirby-button
          class="kirby-breakout wide-view-action kirby-surface-raised"
          size="sm"
          (click)="bannerClicked($event)"
          [attentionLevel]="'2'"
        >
          {{ actionButtonText }}
        </button>

        <button
          kirby-button
          class="kirby-breakout narrow-view-action kirby-surface-raised"
          size="sm"
          (click)="bannerClicked($event)"
          [attentionLevel]="'2'"
          [noDecoration]="true"
          [showIconOnly]="true"
        >
          <span class="kirby-visually-hidden">
            {{ actionButtonText }}
          </span>
        </button>
      }
    </div>
  </div>

  @if (dismissClick.observed) {
    <button
      kirby-button
      size="xs"
      (click)="dismissClicked($event)"
      [attentionLevel]="'2'"
      [noDecoration]="backgroundBlur === 'none'"
      [showIconOnly]="true"
      [attr.aria-label]="translations.get('close') + ' ' + title"
      class="dismiss kirby-surface-raised"
    >
      <kirby-icon name="close"></kirby-icon>
    </button>
  }
</kirby-card>
