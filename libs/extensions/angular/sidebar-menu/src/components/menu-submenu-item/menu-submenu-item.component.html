@let item = vm.item();
<button
  kirby-x-menu-item
  type="button"
  class="submenu-toggle"
  [size]="vm.size()"
  [id]="item.id"
  [icon]="item.icon"
  [attr.aria-controls]="vm.submenuId()"
  [attr.aria-expanded]="vm.isExpanded()"
  (click)="vm.toggleSubmenu()"
>
  {{ item.title }}
  <kirby-icon
    slot="end"
    name="arrow-more"
    class="disclosure"
    [class.rotate]="vm.isExpanded()"
  ></kirby-icon>
</button>
@if (vm.isExpanded()) {
  <ul
    kirby-x-menu-item-list
    [items]="item.children"
    [size]="vm.submenuSize()"
    [id]="vm.submenuId()"
    [@dropDownMenu]
    [@.disabled]="vm.animationsDisabled()"
    cdkDropList
    (cdkDropListDropped)="drop($event)"
  ></ul>
}
