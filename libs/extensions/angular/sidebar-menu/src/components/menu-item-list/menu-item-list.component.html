@for (item of vm.items(); track item.id) {
  @if (item.isDivider) {
    <kirby-divider></kirby-divider>
  } @else if (item.children) {
    <kirby-x-menu-submenu-item
      [item]="item"
      [size]="vm.size()"
      [disableAnimations]="vm.disableAnimations()"
    ></kirby-x-menu-submenu-item>
  } @else {
    <kirby-x-menu-anchor-item [item]="item" [size]="vm.size()"></kirby-x-menu-anchor-item>
  }
}
