@for (item of vm.items(); track item.id) {
  @switch (item.type) {
    @case ('divider') {
      <kirby-divider aria-hidden="true"></kirby-divider>
    }
    @case ('submenu') {
      <li kirby-x-menu-submenu-item [item]="item" [size]="vm.size()"></li>
    }
    @default {
      <li
        kirby-x-menu-anchor-item
        [item]="item"
        [size]="vm.size()"
        cdkDrag
        [cdkDragDisabled]="!vm.isDraggable()"
      ></li>
    }
  }
}
