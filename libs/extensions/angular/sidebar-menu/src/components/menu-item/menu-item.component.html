<div class="menu-item-start {{ size() }}">
  @if (icon(); as icon) {
    <kirby-icon [size]="iconSize()" [name]="icon"></kirby-icon>
  }
</div>

<div class="menu-item-content {{ size() }}">
  <span><ng-content></ng-content></span>
  @if (badge(); as badge) {
    <kirby-badge [themeColor]="badge.themeColor ?? 'primary'">{{ badge.value }}</kirby-badge>
  }
</div>

<div class="menu-item-end">
  <ng-content select="[slot='end']"></ng-content>
</div>
