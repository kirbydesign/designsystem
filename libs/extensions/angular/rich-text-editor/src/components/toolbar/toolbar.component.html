@for (item of items(); track item) {
  @if (item === 'textStyle') {
    <kirby-dropdown
      #styleDropdown
      data-toolbar-item="textStyle"
      [attr.aria-label]="labels().textStyle"
      size="sm"
      attentionLevel="3"
      [items]="blockStyles()"
      [placeholder]="labels().normal"
      [selectedIndex]="blockIndex()"
      [disabled]="disabled()"
      (change)="setBlock($event)"
    >
      <ng-template
        kirbyListItemTemplate
        let-item
        let-selected="selected"
        let-focused="focused"
        let-index="index"
      >
        <button
          class="kirby-rich-text-style-option"
          type="button"
          role="option"
          tabindex="-1"
          [attr.id]="styleDropdown._listboxId + '-item-' + index"
          [attr.aria-selected]="selected"
          [class.keyboard-focused]="focused"
          (click)="styleDropdown.onItemSelect(index)"
        >
          {{ item.text }}
        </button>
      </ng-template>
    </kirby-dropdown>
  } @else {
    <button
      kirby-button
      type="button"
      [noDecoration]="true"
      attentionLevel="3"
      size="md"
      [attr.data-toolbar-item]="item"
      [attr.aria-label]="labels()[item]"
      [attr.title]="labels()[item]"
      [attr.aria-keyshortcuts]="buttons[item].shortcut"
      [attr.aria-pressed]="state()?.active.includes(item) ?? false"
      [disabled]="disabled()"
      (pointerdown)="$event.preventDefault()"
      (click)="editor().execute(item)"
    >
      <kirby-icon [name]="buttons[item].icon" />
    </button>
  }
}
