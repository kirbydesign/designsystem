name: Publish stylelint-plugin to npm

# Tags matching 'vX.X.X-stylelint-plugin' are protected tags and can only be pushed by admins.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-stylelint-plugin'

permissions:
  id-token: write # Required for OIDC (https://docs.github.com/en/actions/concepts/security/openid-connect)
  contents: read

jobs:
  publish_stylelint_plugin:
    name: Publish stylelint-plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Kirby setup
        uses: ./.github/actions/kirby-setup
      - name: Publish stylelint-plugin to npm
        run: npm run publish -- stylelint-plugin
