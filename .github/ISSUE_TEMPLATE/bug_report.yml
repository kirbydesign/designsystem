name: Bug report
description: Create a bug report
title: "[BUG]"
labels: [bug]
assignees: []

body:
  - type: textarea
    id: describe_the_bug
    attributes:
      label: Describe the bug
      placeholder: A clear and concise description of the bug
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Describe how to reproduce the bug
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: What was the expected behavior?
      placeholder: A clear and concise description of what you expected to happen
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How serious is the impact of this issue?
      options:
        - Critical (app crashes or critical user flow broken)
        - High (feature broken)
        - Medium (usable with workaround)
        - Low (minor issue)
        - Trivial (design or code discrepancies, docs)
    validations:
      required: true

  - type: input
    id: kirby_version
    attributes:
      label: Which Kirby version was used?
      placeholder: e.g. v11.6.0
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Add screenshots or videos
      description: |
        Drag and drop images or videos here, or paste them directly.
        You can also copy/paste screenshots into this field.
      placeholder: Paste or drop files here

  - type: input
    id: environment
    attributes:
      label: Environment (OS / Browser)
      description: Add any relevant environment details if applicable
      placeholder: e.g. macOS + Chrome 122, iOS + Safari, Windows + Edge

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any other relevant information or context about the problem
      placeholder: e.g. Only happens after login, only on mobile, etc.
