<ng-content></ng-content>
@if (html || ts || css) {
  <button kirby-button size="sm" attentionLevel="3" (click)="expanded = !expanded">
    {{ expanded ? 'Hide Code' : 'View Code' }}
  </button>
}
@if (expanded && html) {
  <cookbook-code-viewer [html]="html"></cookbook-code-viewer>
}
@if (expanded && ts) {
  <cookbook-code-viewer [ts]="ts"></cookbook-code-viewer>
}
@if (expanded && css) {
  <cookbook-code-viewer [css]="css"></cookbook-code-viewer>
}
