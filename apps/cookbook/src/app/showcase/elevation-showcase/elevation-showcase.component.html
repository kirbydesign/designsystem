<p>
  Click any row to copy the
  <code>var()</code>
  usage to your clipboard.
</p>

<h2>Elevation</h2>
<p>Elevation tokens provide consistent box-shadow layering for depth.</p>
<table class="kirby-table layout-fixed">
  <thead>
    <tr>
      <th>Level</th>
      <th>CSS Custom Property</th>
      <th>Preview</th>
    </tr>
  </thead>
  <tbody>
    @for (token of elevations; track token.name) {
      <tr class="kirby-selectable-row" [cookbookCopyToken]="token.cssVar">
        <td>
          <code>{{ token.name }}</code>
        </td>
        <td>
          <code>{{ token.cssVar }}</code>
        </td>
        <td>
          <span class="elevation-sample" [style.box-shadow]="'var(' + token.cssVar + ')'"></span>
        </td>
      </tr>
    }
  </tbody>
</table>
