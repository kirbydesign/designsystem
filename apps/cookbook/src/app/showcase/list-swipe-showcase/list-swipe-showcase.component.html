<h2>Accessibility</h2>
<p>
  It is possible to provide an accessible name for your list using the
  <code>aria-label</code>
  or
  <code>aria-labelledby</code>
  attribute on the
  <code>kirby-list</code>
  element. More information can be found in
  <a routerLink="/home/showcase/list">the list showcase.</a>
</p>
