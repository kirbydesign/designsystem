<h2>Accessibility</h2>
<h3>Lists</h3>
<p>
  Always provide an accessible label for your list using the
  <code>aria-label</code>
  or
  <code>aria-labelledby</code>
  attribute on the
  <code>kirby-list</code>
  .
  <br />
  More information can be found in
  <a href="/home/showcase/list">the list showcase.</a>
</p>
